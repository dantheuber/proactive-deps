name: CI Merge to Main

on:
  push:
    branches:
      - main

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      # Checkout the repository
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Set up Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Install dependencies
      - name: Install dependencies
        run: npm install

      # Run tests
      - name: Run tests
        run: npm test

      # Extract version from package.json
      - name: Get version from package.json
        id: get_version
        run: echo "VERSION=$(node -p '${{env.PARSE_VERSION}}')" >> $GITHUB_ENV
        env:
          PARSE_VERSION: 'require("./package.json").version'

      # Check if the tag already exists
      - name: Check if tag exists
        id: check_tag
        run: echo "TAG_EXISTS=$(git rev-parse 'v${{env.VERSION}}' >/dev/null 2>&1 && echo true || echo false)" >> $GITHUB_ENV

      # Create a release if the tag does not exist
      - name: Create GitHub Release
        if: env.TAG_EXISTS == 'false'
        uses: actions/create-release@v1
        with:
          tag_name: v${{ env.VERSION }}
          release_name: v${{ env.VERSION }}
          body: |
            ## Changes in v${{ env.VERSION }}
            - Automatically generated release.
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
